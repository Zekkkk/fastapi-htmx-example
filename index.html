<!DOCTYPE html>
<html>
<head>
    <title>My Store</title>
    <meta charset="UTF-8">
</head>

<body>

    <h1>Welcome to My Store<h1>

    <div class="product">
        <h2>Coca Cola</h2>
        <p>Price: $1.50</p>
        <button onclick="buyProduct()">Buy Now</button>
    </div>

    <div class="product">
        <h2>Pepsi</h2>
        <p>Price: $1.40</p>
        <button onclick="buyProduct()">Buy Now</button>
    </div>

    <form>
        <label>Name</label>
        <input type="text" id="name">

        <label>Email</label>
        <input type="email" id="email">

        <button type="submit">Submit</button>
    </form>

    <img src="product.jpg">

    <a href="#">Click here</a>

    <script>
        function buyProduct() {
            alert("Product bought!");
        }

        function calculatePrice(price, quantity) {
            return price * quantity
        }

        console.log("Total:", calculatePrice(10))
    </script>

</body>
</html>
